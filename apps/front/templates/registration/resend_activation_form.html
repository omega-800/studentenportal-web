{% extends 'base.html' %}

{% block title %}Aktivierungsmail erneut senden{% endblock %}

{% block content %}

    <div class="page-header">
        <h1>Aktivierungsmail erneut senden</h1>
    </div>

    <p>Gib deine E-Mail-Adresse ein, um eine neue Aktivierungsmail zu erhalten.</p>

    <form method="post" class="form-horizontal">{% csrf_token %}
        <fieldset>
            <div class="control-group">
                <label for="id_email">E-Mail</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <div class="form-actions">
                <button type="submit" class="button button-primary">Aktivierungsmail senden</button>
            </div>
        </fieldset>
    </form>

{% endblock %}
