{% extends 'base.html' %}
{% load tabs %}

{% block title %}Tipp hinzufügen{% endblock %}

{% block navigation %}
    {% activetab 'navigation' 'tipps' %}
    {{ block.super }}
{% endblock %}

{% block content %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .editor-toolbar button {
            all: unset;
            color: #000;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .editor-toolbar button:hover,
        .editor-toolbar button.active {
            background: #e6e6e6;
            border-radius: 3px;
        }
        .editor-toolbar {
            padding: 5px;
        }
        .editor-toolbar i.separator {
            border-left: 1px solid #d9d9d9;
            margin: 0 6px;
        }
        .EasyMDEContainer .CodeMirror {
            height: 200px;
        }
    </style>

    <div class="page-header" style="margin-bottom: 1.5em;">
        <h1>Tipp hinzufügen</h1>
    </div>

    <form method="POST" class="form-horizontal">{% csrf_token %}
        {% include 'lib/form_loop.html' %}
        <div class="form-actions">
            <input type="submit" class="button button-primary" value="Eintragen" />
            <a href="{% url 'tipps:tipp_list' %}" class="button">Abbrechen</a>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
    <script>
        var descField = document.getElementById('id_description');
        if (descField) {
            new EasyMDE({
                element: descField,
                spellChecker: false,
                status: false,
                autoDownloadFontAwesome: false,
            });
        }
    </script>
{% endblock %}
